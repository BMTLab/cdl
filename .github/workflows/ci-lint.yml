# .github/workflows/ci-lint.yml
#
# ShellCheck, shfmt and the style tests, through the same make targets
# a contributor runs, so CI and `make check` cannot disagree;
# and markdownlint, through the action that bundles the markdownlint
# of `make lint-md`, with every dependency pinned by its commit.
# The job runs on Ubuntu 26.04, whose Python ships the Unicode version
# the width table in cdl.sh was generated from,
# so the table is really compared with its generator here.

name: Lint

on:
  workflow_call:

permissions: {}

jobs:
  lint:
    name: ShellCheck, shfmt, markdownlint, style
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: ⚙️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pinned downloads, .deb files and Homebrew bottles of earlier runs:
      # install-tools.sh checks each download against its pinned digest,
      # Homebrew each bottle against its formula,
      # and the .deb files are those apt fetched and checked on a miss.
      # The release job uses no cache, so none can reach what it publishes.
      - name: 💾 Tool cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cdl-ci
          key: tools-lint-${{ runner.os }}-${{ hashFiles('tools/ci/install-tools.sh') }}

      - name: 🔧 Install tools
        run: tools/ci/install-tools.sh shellcheck shfmt bats zsh

      - name: ℹ️ Environment
        run: tools/ci/report-environment.sh bash zsh

      - name: 🔍 ShellCheck and zsh -n
        run: make lint

      - name: 🎨 shfmt
        run: make format-check

      - name: 📝 markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

      - name: 📐 Style tests
        run: make test-style
