# .github/workflows/ci-lint.yml
#
# ShellCheck, shfmt, rumdl and the style tests, through the same make targets
# a contributor runs, so CI and `make check` cannot disagree;
# the action of rumdl installs the version a contributor runs,
# pinned by its commit, as every dependency is.
# The job runs on Ubuntu 26.04, whose Python ships the Unicode version
# the width table in cdl.sh was generated from,
# so the table is really compared with its generator here.

name: Lint

on:
  workflow_call:

permissions: {}

jobs:
  lint:
    name: ShellCheck, shfmt, rumdl, style
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: ⚙️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pinned downloads, .deb files and Homebrew bottles of earlier runs:
      # install-tools.sh checks each download against its pinned digest,
      # Homebrew each bottle against its formula,
      # and the .deb files are those apt fetched and checked on a miss.
      # The release job uses no cache, so none can reach what it publishes.
      - name: 💾 Tool cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cdl-ci
          key: tools-lint-${{ runner.os }}-${{ hashFiles('tools/ci/install-tools.sh') }}

      - name: 🔧 Install tools
        run: tools/ci/install-tools.sh shellcheck shfmt bats zsh parallel

      - name: ℹ️ Environment
        run: tools/ci/report-environment.sh bash zsh

      - name: 🔍 ShellCheck and zsh -n
        run: make lint

      - name: 🎨 shfmt
        run: make format-check

      # The action checks the binary it downloads against the digest
      # that the release publishes; make runs it as a contributor does.
      - name: 🔧 Install rumdl
        uses: rvben/rumdl@19006897519812a2fdc508314b34738e5c281233 # v0.3.0
        with:
          version: 0.3.0
          install-only: true

      - name: 📝 rumdl
        run: make lint-md

      - name: 📐 Style tests
        run: make test-style
