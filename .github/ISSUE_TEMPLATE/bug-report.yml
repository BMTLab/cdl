name: "🐛 Bug report"
description: cdl does something wrong or unexpected.
labels: ['bug']
assignees:
  - BMTLab
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for taking the time to report a bug!
        The details below let us reproduce it on the same shell and tools.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: >-
        What you saw, with the output pasted as text.
        A screenshot helps when the layout is the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How can we reproduce it?
      description: >-
        The smallest sequence of commands that shows the problem,
        starting from `source ~/.cdl.sh`.
      render: bash
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: cdl version
      description: The output of `cdl -V`.
      placeholder: cdl 2.0.0
    validations:
      required: true

  - type: dropdown
    id: shell
    attributes:
      label: Shell
      options:
        - bash
        - zsh
        - other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Shell version, operating system, ls and awk
      description: >-
        For example: bash 5.3.9, Ubuntu 26.04,
        `ls --version | head -n 1` (or "BSD ls"), `awk --version | head -n 1`.
      placeholder: bash 5.3.9, Ubuntu 26.04, uutils ls 0.10.0, mawk 1.3.4
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Anything else we need to know?
